name: Layered CI

on:
  pull_request:
    branches: ["SNF"]
  workflow_dispatch:

jobs:
  layered-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm test
