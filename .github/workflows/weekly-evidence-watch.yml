name: Weekly Evidence Watch

on:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  evidence-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Refresh PubMed evidence (advisory — external URLs may be slow)
        continue-on-error: true
        run: python scripts/expand_pubmed.py
      - name: Inject studies into evidence page (advisory)
        continue-on-error: true
        run: python scripts/inject_studies.py
      - name: Check external links (advisory — soft report only)
        continue-on-error: true
        run: npm run check:links -- --external-only --soft --report reports/link-check-report.md
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh evidence and link report"
          title: "Weekly evidence and link refresh"
          body: "Automated evidence refresh and external link report. Review before merge."
          branch: automation/weekly-evidence-watch
