name: Daily Repository Health

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-repository-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - run: npm ci

      - name: Run repository health checks
        id: health
        continue-on-error: true
        run: npm run health

      - name: Maintain deduplicated health issue
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'maintenance-health-failure';
            const title = 'Maintenance: repository health check failing';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = process.env.HEALTH_OUTCOME === 'failure';
            const body =
              `## Repository health status\n\n` +
              `- Status: ${failed ? '❌ failing' : '✅ recovered'}\n` +
              `- Workflow: \`${context.workflow}\`\n` +
              `- Run: ${runUrl}\n` +
              `- Checked at: ${new Date().toISOString()}\n\n` +
              `### Owner action\n` +
              `1. Open the failing run and inspect logs.\n` +
              `2. Fix the failing repository health check(s).\n` +
              `3. Re-run this workflow (or wait for the next daily run) to confirm recovery.\n`;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'd73a4a',
                  description: 'Open when scheduled repository health checks fail',
                });
              } else {
                throw error;
              }
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            const matchingOpen = openIssues.filter((issue) => !issue.pull_request && issue.title === title);
            const [primary, ...duplicates] = matchingOpen;

            if (failed) {
              if (primary) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: primary.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: [label],
                });
              }

              for (const issue of duplicates) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: 'Closing duplicate maintenance health issue in favor of a single tracker.',
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            } else {
              for (const issue of matchingOpen) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `✅ Repository health recovered in ${runUrl}. Closing this tracker.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }

      - name: Fail workflow if health check failed
        if: steps.health.outcome == 'failure'
        run: exit 1
