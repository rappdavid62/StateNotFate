name: Weekly Boundary Watch

on:
  schedule:
    - cron: "41 14 * * 1"
  workflow_dispatch:

jobs:
  boundary-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run audit:privacy
