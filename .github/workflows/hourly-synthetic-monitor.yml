name: Hourly Synthetic Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BASE_URL: https://statenotfate.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Preflight live site reachability
        run: |
          curl --fail --silent --show-error --location --max-time 20 "$PLAYWRIGHT_BASE_URL" >/dev/null
          echo "Live site reachable: $PLAYWRIGHT_BASE_URL"

      # Tier 1: critical checks must pass. Homepage, 988 crisis line, safety scope, accessibility.
      # A failure here fails the entire job and triggers an alert.
      - name: Critical checks - site must be up and safe
        run: >
          npx playwright test tests/public
          --config=playwright.production.config.ts
          --grep "@critical"

      # Tier 2: advisory checks are nice-to-pass but never kill the job.
      # Failures are logged as warnings in the Actions summary.
      # SEO meta, localStorage-heavy app tests, and evidence links can drift without being a production emergency.
      - name: Advisory checks - warnings only, never fails job
        continue-on-error: true
        run: >
          npx playwright test tests/public
          --config=playwright.production.config.ts
          --grep "@advisory"

      # Quick check that the backup site is up. Advisory - never blocks the job.
      - name: Beta site pulse - statenotfatebeta.netlify.app
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://statenotfatebeta.netlify.app)
          if [ "$STATUS" = "200" ]; then
            echo "Beta site is up (HTTP $STATUS)"
          else
            echo "Beta site returned HTTP $STATUS - advisory warning only"
            exit 1
          fi
