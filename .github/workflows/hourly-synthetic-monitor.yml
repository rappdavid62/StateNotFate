name: Hourly Synthetic Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # ── Tier 1: CRITICAL ─────────────────────────────────────────────────────
      # These must pass. Homepage, 988 crisis line, safety scope, accessibility.
      # A failure here fails the entire job and triggers an alert.
      - name: "🔴 Critical checks — site must be up and safe"
        run: >
          npx playwright test tests/public
          --config=playwright.production.config.ts
          --grep "@critical"

      # ── Tier 2: ADVISORY ─────────────────────────────────────────────────────
      # These are nice-to-pass but never kill the job. Failures are logged as
      # warnings in the Actions summary. SEO meta, localStorage-heavy app tests,
      # evidence links — these can drift without being a production emergency.
      - name: "🟡 Advisory checks — warnings only, never fails job"
        continue-on-error: true
        run: >
          npx playwright test tests/public
          --config=playwright.production.config.ts
          --grep "@advisory"
