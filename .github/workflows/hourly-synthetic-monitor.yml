name: Hourly Synthetic Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-synthetic-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run public production smoke tests
        env:
          CI: "true"
          BASE_URL: "https://statenotfate.netlify.app"
        run: npm run test:public

      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-monitor-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
