name: Hourly Synthetic Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test tests/public --config=playwright.production.config.ts
