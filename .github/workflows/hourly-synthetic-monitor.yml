name: Hourly Synthetic Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run live-site monitor (excludes 404 SPA-incompatible test)
        run: >
          npx playwright test tests/public
          --config=playwright.production.config.ts
          --grep-invert "SEO/performance skeleton"
