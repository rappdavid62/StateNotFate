version: 2
updates:
  # Keep GitHub Actions versions current automatically.
  # Dependabot opens a PR each Monday if any action (checkout, setup-node, etc.)
  # has a newer version available. One-click merge — no manual tracking needed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "ci-maintenance"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  # Keep npm dev-dependencies current (Playwright, axe-core, etc.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: 1
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    # Only update dev deps — there are no production deps in this static site
    allow:
      - dependency-type: development
