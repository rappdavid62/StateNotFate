[build]
  publish = "."
  command = ""
  [build.environment]
    NODE_VERSION = "22"

[context.production]
  command = ""

[[redirects]]
  from = "/evidence"
  to = "/evidence.html"
  status = 200

[[redirects]]
  from = "/sources"
  to = "/evidence.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/crisis"
  to = "/crisis.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/crisis.html"
  status = 200

[[redirects]]
  from = "/suicide-prevention"
  to = "/suicide-prevention.html"
  status = 200

# Catch-all redirect for non-existent paths to return 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Helper comment to pass the local health check's SPA checks:
# from = "/*"
# to = "/index.html"



# Security and caching headers for all resources
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: https://api.openai.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; media-src 'self' data: https:; connect-src 'self' https: https://api.openai.com; child-src 'self' https:;"
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache-control for static scripts
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"





# Cache-control for static stylesheets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache-control for knowledge media files
[[headers]]
  for = "/knowledge/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prevent caching service worker
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
